<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Inventory Manager</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 15px; background: #f4f6f9; }
    h2 { text-align: center; color: #333; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 15px; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
    input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button.pdf-btn { background: #007bff; margin-bottom: 10px; }
    button.wa-btn { background: #25D366; }
    table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #343a40; color: white; }
    .edit-btn { background: #ffc107; color: black; padding: 5px; width: auto; font-size: 12px; }
    .del-btn { background: #dc3545; color: white; padding: 5px; width: auto; font-size: 12px; }
  </style>
</head>
<body>

  <h2>📦 Smart Inventory & Order</h2>
  <div class="subtitle">Daily Stock & Quantity Manager</div>

  <div class="card">
    <label><b>📅 Select Date (Auto Save):</b></label>
    <input type="date" id="selectedDate" onchange="loadItems()">

    <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
    <label><b>➕ Add New / Custom Item:</b></label>
    <input type="hidden" id="editIndex" value="-1">
    <input type="text" id="itemName" placeholder="Item Name (e.g. Sugar, Salt, Garam Masala)">
    <input type="text" id="itemQty" placeholder="Quantity (e.g. 1kg or 350grm)">
    <button onclick="saveItem()" id="saveBtn">➕ Add to List</button>
  </div>

  <div class="card" style="overflow-x:auto;">
    <table id="inventoryTable">
      <thead>
        <tr>
          <th>S.No.</th>
          <th>Item Name</th>
          <th>Quantity</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <button class="pdf-btn" onclick="downloadPDF()">📄 Download PDF Report</button>
  <button class="wa-btn" onclick="shareWhatsApp()">📲 Share on WhatsApp</button>

  <script>
    document.getElementById('selectedDate').valueAsDate = new Date();

    const defaultItems = [
      { name: "Sugar", qty: "" },
      { name: "Salt", qty: "" },
      { name: "Garam Masala", qty: "" },
      { name: "Powder", qty: "" }
    ];

    function getStorageKey() {
      return 'smart_inv_' + document.getElementById('selectedDate').value;
    }

    function loadItems() {
      let data = JSON.parse(localStorage.getItem(getStorageKey()));
      if (!data) {
        data = JSON.parse(JSON.stringify(defaultItems));
        localStorage.setItem(getStorageKey(), JSON.stringify(data));
      }

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      data.forEach((item, index) => {
        tbody.innerHTML += `
          <tr>
            <td>${index + 1}.</td>
            <td><b>${item.name}</b></td>
            <td>${item.qty}</td>
            <td>
              <button class="edit-btn" onclick="editItem(${index})">Edit</button>
              <button class="del-btn" onclick="deleteItem(${index})">X</button>
            </td>
          </tr>`;
      });
    }

    function saveItem() {
      const name = document.getElementById('itemName').value.trim();
      const qty = document.getElementById('itemQty').value.trim();
      const editIndex = parseInt(document.getElementById('editIndex').value);

      if (!name || !qty) { alert('Kripya Item Name aur Quantity dono bharein!'); return; }

      let data = JSON.parse(localStorage.getItem(getStorageKey())) || [];
      if (editIndex === -1) {
        data.push({ name, qty });
      } else {
        data[editIndex] = { name, qty };
        document.getElementById('editIndex').value = '-1';
        document.getElementById('saveBtn').innerText = '➕ Add to List';
      }

      localStorage.setItem(getStorageKey(), JSON.stringify(data));
      document.getElementById('itemName').value = '';
      document.getElementById('itemQty').value = '';
      loadItems();
    }

    function editItem(index) {
      const data = JSON.parse(localStorage.getItem(getStorageKey())) || [];
      document.getElementById('itemName').value = data[index].name;
      document.getElementById('itemQty').value = data[index].qty;
      document.getElementById('editIndex').value = index;
      document.getElementById('saveBtn').innerText = '💾 Update Quantity/Item';
    }

    function deleteItem(index) {
      let data = JSON.parse(localStorage.getItem(getStorageKey())) || [];
      data.splice(index, 1);
      localStorage.setItem(getStorageKey(), JSON.stringify(data));
      loadItems();
    }

    function generatePDFDoc() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const date = document.getElementById('selectedDate').value;
      const data = JSON.parse(localStorage.getItem(getStorageKey())) || [];

      doc.text(`Inventory Order Report - ${date}`, 14, 15);
      const rows = data.map((item, i) => [i + 1, item.name, item.qty]);

      doc.autoTable({
        head: [['S.No.', 'Item Name', 'Quantity']],
        body: rows,
        startY: 20
      });
      return { doc, date, data };
    }

    function downloadPDF() {
      const { doc, date } = generatePDFDoc();
      doc.save(`Inventory_${date}.pdf`);
    }

    async function shareWhatsApp() {
      const { doc, date, data } = generatePDFDoc();
      if (data.length === 0) { alert('Share karne ke liye koi item nahi hai!'); return; }

      const pdfBlob = doc.output('blob');
      const file = new File([pdfBlob], `Inventory_${date}.pdf`, { type: 'application/pdf' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: `Inventory Order ${date}`,
            text: `Order List (${date})`
          });
          return;
        } catch (err) { console.log(err); }
      }

      let text = `*📦 Inventory Order List (${date})*\n\n`;
      data.forEach((item, i) => {
        text += `${i + 1}. ${item.name} - *${item.qty}*\n`;
      });
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    loadItems();
  </script>
</body>
</html>
