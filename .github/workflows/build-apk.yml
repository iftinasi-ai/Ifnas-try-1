name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Capacitor & Build APK
        run: |
          mkdir www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4
          npx cap init "InventoryApp" "com.inventory.app" --web-dir=www
          npx cap add android
          
          # Force Gradle 8.5 wrapper to support Java 21
          cd android
          ./gradlew wrapper --gradle-version 8.5
          
          # Fix for duplicate classes conflict
          echo "android.bundle.enableUncompressedNativeLibs=false" >> gradle.properties
          
          cd ..
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Inventory-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
